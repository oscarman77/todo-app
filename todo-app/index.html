<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>To-Do List</h1>

      <input id="task-input" type="text" placeholder="Add a task...">

    </div>
    <ul id="task-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
